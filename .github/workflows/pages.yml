name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
      - claude/referral-tracking-presentation-t9xlor
  workflow_dispatch:

# Necessário para o deploy-pages autenticar via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um que já está no ar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: liga o Pages (source = GitHub Actions) na primeira execução,
      # sem precisar mexer em Settings antes do primeiro deploy
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Site estático, sem build: sobe o repositório como está
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
